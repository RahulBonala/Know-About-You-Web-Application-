<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="KnowYou — Cosmic Identity Engine">
  <!-- Rahul Mark System v1 — Ink pair (#19140f field / #ff6b1a glyph, 6.4:1)
       The four-point star the app already used as its emoji favicon, given the
       chart it was always implying: one self, one orbit, one transit. The orbit
       is kept thin and quiet so the star stays the thing you read at 16px. -->
  <rect width="512" height="512" rx="114" fill="#19140f"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#ff6b1a" stroke-opacity="0.24" stroke-width="6"/>
  <svg x="116" y="116" width="280" height="280" viewBox="0 0 24 24" fill="none">
    <!-- orbit -->
    <ellipse cx="12" cy="12" rx="10.4" ry="4" transform="rotate(-24 12 12)"
             stroke="#ff6b1a" stroke-opacity="0.55" stroke-width="1.3"/>
    <!-- the transiting body -->
    <circle cx="21.5" cy="7.8" r="1.35" fill="#fbf7f0"/>
    <!-- the self: the one filled element -->
    <path d="M12 4.7c.5 3.8 3.3 6.6 7.1 7.1v.4c-3.8.5-6.6 3.3-7.1 7.1h-.4c-.5-3.8-3.3-6.6-7.1-7.1v-.4c3.8-.5 6.6-3.3 7.1-7.1Z" fill="#ff6b1a"/>
  </svg>
</svg>
